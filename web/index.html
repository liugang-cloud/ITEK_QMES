<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>QMES 质量管理系统</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <script src="js/vue.min.js"></script>
  <script src="js/qrcode.min.js"></script>
  <script src="js/xlsx.full.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif; font-size: 14px; color: #344054; background: #f3f5f9; }

    .app { display: flex; flex-direction: column; height: 100vh; }

    /* 顶部导航 */
    .topbar {
      height: 56px; line-height: 56px; padding: 0 28px;
      background: linear-gradient(90deg, #1565c0, #1e88e5); color: #fff;
      display: flex; justify-content: space-between; align-items: center;
      box-shadow: 0 2px 8px rgba(21, 101, 192, .35);
    }
    .topbar { line-height: normal; }
    .topbar .logo { font-size: 19px; font-weight: bold; letter-spacing: 2px; }
    .topbar .user { font-size: 13px; opacity: .95; background: rgba(255,255,255,.15); padding: 6px 14px; border-radius: 16px; }

    /* 主体：侧边栏 + 内容区 */
    .body { flex: 1; display: flex; overflow: hidden; }

    .sidebar {
      width: 200px; background: #fff; border-right: 1px solid #e8ebf0;
      overflow-y: auto; padding-bottom: 20px;
    }
    .sidebar .group-title {
      padding: 18px 20px 8px; font-size: 12px; color: #98a2b3; font-weight: bold; letter-spacing: 1px;
    }
    .sidebar .menu-item {
      padding: 11px 20px 11px 36px; cursor: pointer; color: #475467;
      border-left: 3px solid transparent; transition: all .2s; position: relative;
    }
    .sidebar .menu-item:hover { background: #f4f8fe; color: #1e88e5; }
    .sidebar .menu-item.active {
      background: #eaf3fd; color: #1565c0; border-left-color: #1565c0; font-weight: bold;
    }

    .main { flex: 1; padding: 16px 28px 24px; overflow-y: auto; }

    /* 页签栏 */
    .tabbar { display: flex; align-items: flex-end; gap: 4px; margin-bottom: 14px; flex-wrap: wrap; }
    .tab {
      display: flex; align-items: center; padding: 7px 10px 7px 14px;
      background: #e4e9f2; border-radius: 8px 8px 0 0; cursor: pointer;
      font-size: 13px; color: #475467; transition: all .15s;
      border: 1px solid transparent; border-bottom: none; user-select: none;
    }
    .tab:hover { background: #eef2f8; color: #1e88e5; }
    .tab.active { background: #fff; color: #1565c0; font-weight: bold; border-color: #e8ebf0; }
    .tab .tab-close {
      margin-left: 8px; width: 18px; height: 18px; line-height: 16px; text-align: center;
      border-radius: 50%; font-size: 14px; color: #98a2b3;
    }
    .tab .tab-close:hover { background: #fda4a4; color: #fff; }

    /* 表格内操作链接 */
    .del-link { color: #e53935; text-decoration: none; }
    .del-link:hover { text-decoration: underline; }

    .empty-tip { text-align: center; color: #909399; padding: 60px 0; }

    .page-title { font-size: 18px; margin-bottom: 16px; color: #1d2939; font-weight: bold; }
    .page-title::before {
      content: ""; display: inline-block; width: 4px; height: 16px;
      background: #1e88e5; border-radius: 2px; margin-right: 8px; vertical-align: -2px;
    }

    .guide-card, .panel {
      background: #fff; border-radius: 10px; padding: 24px;
      box-shadow: 0 1px 3px rgba(16, 24, 40, .07), 0 1px 2px rgba(16, 24, 40, .04);
      line-height: 2;
    }
    .guide-card h3 { color: #1565c0; margin: 14px 0 6px; font-size: 15px; }
    .guide-card p { color: #667085; }

    /* ===== 业务链路总览 ===== */
    .flow-card {
      padding: 22px 24px 18px;
      border: 1px solid #e3edf8;
      background: linear-gradient(135deg, #f6fafe 0%, #eef5fd 100%);
    }
    .flow-main { display: flex; flex-wrap: wrap; gap: 22px; }
    .flow-node {
      flex: 1 1 0; min-width: 116px; position: relative; text-align: center;
      padding: 14px 10px; border-radius: 10px;
      border: 1px solid #cfe0f3;
      background: #fff;
      box-shadow: 0 1px 3px rgba(21, 101, 192, .08);
    }
    .flow-node .fn-t { font-size: 13.5px; font-weight: bold; color: #1565c0; }
    .flow-node .fn-s { font-size: 11.5px; color: #7ba7d4; margin-top: 4px; line-height: 1.5; }
    .flow-node:not(:last-child)::after {
      content: "→"; position: absolute; right: -19px; top: 50%; margin-top: -10px;
      color: #7ba7d4; font-size: 15px;
    }
    .flow-note {
      margin-top: 16px; padding-top: 12px; border-top: 1px dashed #d6e4f4;
      color: #667085; font-size: 12.5px; line-height: 1.9;
    }

    .link-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(440px, 1fr));
      gap: 14px; margin-top: 14px;
    }
    .link-card {
      padding: 16px 20px 18px; border-top: 3px solid #1565c0; line-height: 1.65;
    }
    .link-head { display: flex; align-items: center; gap: 9px; margin-bottom: 7px; }
    .link-no {
      color: #fff; font-size: 11.5px; font-weight: bold; letter-spacing: .5px;
      border-radius: 5px; padding: 2px 7px;
    }
    .link-title { font-size: 15px; font-weight: bold; color: #1d2939; }
    .link-tag {
      margin-left: auto; font-size: 11.5px; color: #667085; background: #eef3fa;
      border-radius: 10px; padding: 2px 9px; white-space: nowrap;
    }
    .link-desc { color: #667085; font-size: 12.5px; margin-bottom: 12px; }
    .link-steps { display: flex; flex-wrap: wrap; gap: 18px; margin-bottom: 11px; }
    .link-step {
      flex: 1 1 0; min-width: 86px; position: relative;
      background: #f8fafc; border: 1px solid #e8ebf0; border-radius: 7px; padding: 8px 10px;
    }
    .link-step:not(:last-child)::after {
      content: "›"; position: absolute; right: -12px; top: 50%; margin-top: -11px;
      color: #7ba7d4; font-size: 16px;
    }
    .link-step .ls-t { font-size: 12px; font-weight: bold; color: #1565c0; }
    .link-step .ls-d { font-size: 11px; color: #98a2b3; margin-top: 2px; line-height: 1.5; }
    .link-notes { margin: 0; padding-left: 15px; color: #667085; font-size: 12px; line-height: 1.8; }
    .link-notes li { margin-top: 2px; }
    .link-notes li::marker { color: #7ba7d4; }

    .form-row { margin-bottom: 14px; display: flex; align-items: center; }
    .form-row label { display: inline-block; width: 100px; color: #667085; flex-shrink: 0; }
    .form-row input, .form-row select {
      padding: 7px 12px; border: 1px solid #d0d5dd; border-radius: 6px; width: 240px; outline: none;
      transition: border-color .2s, box-shadow .2s; background: #fff; color: #344054;
    }
    .form-row input:focus, .form-row select:focus {
      border-color: #1e88e5; box-shadow: 0 0 0 3px rgba(30, 136, 229, .12);
    }
    table input, table select {
      padding: 6px 10px; border: 1px solid #d0d5dd; border-radius: 6px; outline: none;
      transition: border-color .2s, box-shadow .2s;
    }
    table input:focus, table select:focus {
      border-color: #1e88e5; box-shadow: 0 0 0 3px rgba(30, 136, 229, .12);
    }

    button {
      padding: 8px 20px; background: linear-gradient(180deg, #2196f3, #1e88e5); color: #fff;
      border: none; border-radius: 6px; cursor: pointer; font-size: 14px;
      box-shadow: 0 1px 2px rgba(16, 24, 40, .1); transition: all .2s;
    }
    button:hover { background: linear-gradient(180deg, #1e88e5, #1976d2); box-shadow: 0 2px 6px rgba(30, 136, 229, .35); }
    button:active { transform: translateY(1px); box-shadow: none; }
    button:disabled { background: #c4cbd4; cursor: not-allowed; box-shadow: none; }
    button.danger { background: linear-gradient(180deg, #f66, #f56c6c); }
    button.danger:hover { background: linear-gradient(180deg, #f56c6c, #e64646); }
    button.mini { padding: 4px 14px; font-size: 13px; }

    /* 检验规则下拉多选 */
    .ms-wrap { position: relative; width: 470px; }
    .ms-input {
      min-height: 38px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px;
      padding: 5px 32px 5px 9px; border: 1px solid #d0d5dd; border-radius: 6px;
      background: #fff; cursor: pointer; transition: border-color .2s, box-shadow .2s;
    }
    .ms-input:hover { border-color: #1e88e5; }
    .ms-ph { color: #98a2b3; }
    .ms-tag {
      display: inline-flex; align-items: center; background: #eaf3fd; color: #1565c0;
      border-radius: 4px; padding: 2px 4px 2px 8px; font-size: 12px; line-height: 1.6;
    }
    .ms-tag-x {
      margin-left: 2px; font-style: normal; cursor: pointer; color: #7ba7d4;
      padding: 0 4px; border-radius: 3px; font-size: 13px;
    }
    .ms-tag-x:hover { background: #d6e8fb; color: #e53935; }
    .ms-arrow {
      position: absolute; right: 11px; top: 50%; margin-top: -9px;
      color: #98a2b3; font-size: 12px; pointer-events: none; transition: transform .2s;
    }
    .ms-arrow.open { transform: rotate(180deg); }
    .ms-panel {
      position: absolute; left: 0; top: calc(100% + 5px); z-index: 30; width: 100%;
      max-height: 280px; overflow: auto; padding: 5px; background: #fff;
      border: 1px solid #e6eaf0; border-radius: 8px;
      box-shadow: 0 8px 24px rgba(16, 24, 40, .13);
    }
    .ms-item {
      display: flex; align-items: center; gap: 10px; padding: 8px 10px;
      border-radius: 6px; cursor: pointer; font-size: 13px; transition: background .12s;
    }
    .ms-item:hover { background: #f4f8fe; }
    .ms-item.active { background: #eaf3fd; }
    .ms-code { font-weight: bold; color: #344054; white-space: nowrap; }
    .ms-item.active .ms-code { color: #1565c0; }
    .ms-name { color: #667085; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ms-item.active .ms-name { color: #1565c0; }
    .ms-check { margin-left: auto; color: #1e88e5; opacity: 0; font-size: 13px; }
    .ms-item.active .ms-check { opacity: 1; }
    .ms-empty { color: #909399; padding: 9px 10px; font-size: 13px; }

    .tip { margin-top: 12px; padding: 10px 14px; border-radius: 8px; line-height: 1.6; }
    .tip.ok { background: #f0f9eb; color: #529b2e; border: 1px solid #c2e7b0; }
    .tip.err { background: #fef0f0; color: #dd4b4b; border: 1px solid #fbc4c4; }
    .auto-tag { display: inline-block; margin-left: 4px; padding: 1px 6px; border-radius: 8px; font-size: 12px; color: #fff; background: #0d9488; vertical-align: middle; }

    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { padding: 11px 14px; text-align: left; border-bottom: 1px solid #eef1f5; }
    th { background: #f7f9fc; color: #667085; font-weight: bold; font-size: 13px; white-space: nowrap; }
    tbody tr { transition: background .15s; }
    tr:hover td { background: #f7fafd; }
    tbody tr:last-child td { border-bottom: none; }
    tr.clickable { cursor: pointer; }

    .ws-status { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
    .ws-status.on { background: #4ade80; box-shadow: 0 0 5px #4ade80; }
    .ws-status.off { background: #f87171; }

    /* 分页条 */
    .pager { display: flex; align-items: center; gap: 12px; margin-top: 14px; color: #667085; font-size: 13px; }
    .pager button { padding: 5px 14px; font-size: 13px; }
    .pager select { padding: 5px 8px; border: 1px solid #d0d5dd; border-radius: 6px; outline: none; background: #fff; color: #344054; }
    .pager select:focus { border-color: #1e88e5; }

    /* 登录页 */
    .login-page {
      flex: 1; display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #1565c0, #1e88e5 55%, #42a5f5);
    }
    .login-box {
      width: 360px; background: #fff; border-radius: 12px; padding: 34px 32px 30px;
      box-shadow: 0 12px 40px rgba(16, 24, 40, .25);
    }
    .login-box .login-title { font-size: 20px; font-weight: bold; color: #1565c0; text-align: center; letter-spacing: 2px; }
    .login-box .login-sub { font-size: 13px; color: #98a2b3; text-align: center; margin: 8px 0 26px; }
    .login-field { margin-bottom: 16px; }
    .login-field label { display: block; font-size: 13px; color: #667085; margin-bottom: 6px; }
    .login-field input {
      width: 100%; padding: 9px 12px; border: 1px solid #d0d5dd; border-radius: 6px;
      outline: none; font-size: 14px; color: #344054; transition: border-color .2s, box-shadow .2s;
    }
    .login-field input:focus { border-color: #1e88e5; box-shadow: 0 0 0 3px rgba(30, 136, 229, .12); }
    .login-error {
      margin-bottom: 14px; padding: 8px 12px; border-radius: 6px; font-size: 13px;
      background: #fef0f0; color: #dd4b4b; border: 1px solid #fbc4c4;
    }
    .login-btn { width: 100%; padding: 10px 0; font-size: 15px; letter-spacing: 4px; }
    .topbar .logout-link {
      margin-left: 10px; padding-left: 10px; border-left: 1px solid rgba(255,255,255,.45);
      cursor: pointer; 
    }
    .topbar .logout-link:hover { color: #ffe082; }

    /* 弹窗 */
    .modal-mask {
      position: fixed; inset: 0; background: rgba(0,0,0,.45);
      display: flex; align-items: center; justify-content: center; z-index: 100;
    }
    .modal {
      width: 90%; background: #fff; border-radius: 10px; overflow: hidden;
      box-shadow: 0 12px 40px rgba(0,0,0,.25);
    }
    .modal-title {
      padding: 14px 18px; background: #f7f9fc; border-bottom: 1px solid #eef1f5;
      font-weight: bold; color: #1565c0; font-size: 15px;
    }
    .modal-body { padding: 18px; max-height: 70vh; overflow: auto; }
    .modal-footer { padding: 12px 18px; border-top: 1px solid #eef1f5; text-align: right; }

    /* ========== 系统架构图（扁平版） ========== */
    .arch-wrap{--bg:#f4f6fa;--bg2:#ffffff;--ink:#1d2939;--muted:#667085;--rule:#e4e9f2;
      --accent:#1565c0;--accent2:#0d9488;
      --font-sans:"PingFang SC","Microsoft YaHei","Segoe UI",Roboto,sans-serif;
      --font-mono:"Cascadia Code",Consolas,"Courier New",monospace;--r:10px;
      color:var(--ink);font-family:var(--font-sans);font-size:14px;line-height:1.6}
    .arch-wrap .layout{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:14px;align-items:start}
    .arch-wrap .layers{display:flex;flex-direction:column;gap:9px}
    .arch-wrap .band{background:var(--bg2);border:1px solid var(--rule);border-left:5px solid var(--accent);border-radius:var(--r);padding:11px 14px}
    .arch-wrap .band .bl{display:flex;align-items:baseline;gap:10px;margin-bottom:8px;flex-wrap:wrap}
    .arch-wrap .band .bl b{font-size:14px}
    .arch-wrap .band .bl i{font-style:normal;color:var(--muted);font-size:12px;font-family:var(--font-mono)}
    .arch-wrap .band .bl .cnt{margin-left:auto;font-size:11.5px;color:var(--muted);background:#eef2f8;border-radius:999px;padding:2px 10px}
    .arch-wrap .chips{display:flex;flex-direction:column}
    .arch-wrap .grow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:3px 0}
    .arch-wrap .grow+.grow{border-top:1px dashed #eef1f5}
    .arch-wrap .glabel{font-size:11px;color:#98a2b3;min-width:70px;flex-shrink:0;font-weight:600}
    .arch-wrap .chip{font-family:var(--font-mono);font-size:12px;padding:4px 9px;border-radius:6px;border:1px solid var(--rule);
      background:#f8fafc;color:#344054;cursor:pointer;transition:.12s;white-space:nowrap}
    .arch-wrap .chip:hover{border-color:var(--accent);color:var(--accent);background:#f0f7ff}
    .arch-wrap .chip.rel{border-color:var(--accent);background:#e8f1fd;color:#0d47a1;font-weight:600;box-shadow:0 0 0 2px rgba(21,101,192,.13)}
    .arch-wrap .chip.sel{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:700}
    .arch-wrap .chip.dim{opacity:.25}
    .arch-wrap .chip.feat{background:linear-gradient(135deg,#fff7e6,#ffeecc);border-color:#e0a030;color:#8a5300}
    .arch-wrap .chip.feat.sel{background:#c07800;color:#fff;border-color:#a86400}
    .arch-wrap .legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12.5px;color:var(--muted);padding:2px 4px;margin-bottom:8px}
    .arch-wrap .legend i{font-style:normal;display:inline-flex;align-items:center;gap:5px}
    .arch-wrap .legend .sw{width:11px;height:11px;border-radius:3px;display:inline-block}
    .arch-wrap .detail{position:sticky;top:16px;background:var(--bg2);border:1px solid var(--rule);border-radius:var(--r);max-height:calc(100vh - 100px);overflow:auto}
    .arch-wrap .detail .dh{padding:13px 16px;border-bottom:1px solid var(--rule);background:#f8fafc;border-radius:var(--r) var(--r) 0 0}
    .arch-wrap .detail .dh .dt{font-weight:700;font-size:15px;color:#0d47a1;font-family:var(--font-mono);word-break:break-all}
    .arch-wrap .detail .dh .ds{color:var(--muted);font-size:12.5px;margin-top:2px}
    .arch-wrap .detail .dbody{padding:12px 16px}
    .arch-wrap .detail .empty{color:var(--muted);font-size:13px;text-align:center;padding:44px 18px}
    .arch-wrap .kv-group{margin-bottom:12px}
    .arch-wrap .kv-group .kg-t{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.5px;margin-bottom:5px}
    .arch-wrap .kv-line{display:flex;gap:8px;font-size:13px;padding:2px 0}
    .arch-wrap .kv-line .k{color:var(--muted);min-width:64px;flex-shrink:0}
    .arch-wrap .kv-line .v{color:var(--ink);word-break:break-all}
    .arch-wrap .kv-line .v.code{font-family:var(--font-mono);font-size:12.5px;color:#0d47a1}
    .arch-wrap .pill{display:inline-block;font-size:11.5px;padding:2px 9px;border-radius:999px;font-weight:600;color:#fff}
    .arch-wrap .lk{display:inline-block;font-family:var(--font-mono);font-size:12px;padding:2px 8px;border-radius:5px;
      border:1px solid #d5dfeB;background:#f8fafc;color:#344054;margin:2px 4px 2px 0;cursor:pointer}
    .arch-wrap .lk:hover{border-color:var(--accent);background:#e8f1fd;color:#0d47a1}
    .arch-wrap .lk.c{border-color:#d8ccf0;background:#f7f4fd;color:#5b21b6}
    .arch-wrap .lk.c:hover{border-color:#7c3aed;background:#efe9fb}
    .arch-wrap .lk.a{border-color:#bfe3e0;background:#f2fbfa;color:#0f766e}
    .arch-wrap .lk.a:hover{border-color:#0d9488;background:#dcf3f1}
    .arch-wrap .chain{display:flex;flex-wrap:wrap;align-items:center;gap:4px;padding:3px 0;border-bottom:1px dashed #f0f3f8}
    .arch-wrap .chain:last-child{border-bottom:none}
    .arch-wrap .chain .arr{color:#b6c2d2;font-size:12px;font-family:var(--font-mono)}
    .arch-wrap .chain .chain-none{color:#c0c8d4;font-size:12px}
    .arch-wrap .steps-group .step-line{display:flex;gap:8px;padding:3px 0;border-bottom:1px dashed #f0f3f8}
    .arch-wrap .steps-group .step-line:last-child{border-bottom:none}
    .arch-wrap .steps-group .step-no{flex-shrink:0;width:18px;height:18px;border-radius:50%;background:#e8f1fd;color:#0d47a1;
      font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;font-family:var(--font-mono);margin-top:2px}
    .arch-wrap .steps-group .step-text{font-size:12.5px;color:var(--ink);line-height:1.7}
    .arch-wrap .ftab{width:100%;border-collapse:collapse;font-size:12.5px}
    .arch-wrap .ftab th{text-align:left;padding:6px 8px;background:#eef2f8;color:#475467;font-size:11.5px;font-weight:700}
    .arch-wrap .ftab td{padding:5px 8px;border-bottom:1px solid #f0f3f8;font-family:var(--font-mono)}
    .arch-wrap .ftab .pk{color:#c07800;font-weight:700}
    @media (max-width:980px){
      .arch-wrap .layout{grid-template-columns:1fr}
      .arch-wrap .detail{position:static;max-height:none}
    }

    /* ===== 良率分析 ===== */
    .yield-page .yield-search {
      display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center;
      padding: 14px 18px; background: #f8fafc; border: 1px solid #e4e9f2;
      border-radius: 8px; margin-bottom: 16px;
    }
    .yield-page .yield-search label { font-size: 14px; color: #344054; font-weight: 500; }
    .yield-page .yield-search select,
    .yield-page .yield-search input[type="date"] {
      padding: 7px 12px; border: 1px solid #d0d5dd; border-radius: 6px;
      font-size: 14px; color: #344054; background: #fff; outline: none;
      transition: border-color .2s, box-shadow .2s;
    }
    .yield-page .yield-search select:focus,
    .yield-page .yield-search input:focus { border-color: #1e88e5; box-shadow: 0 0 0 3px rgba(30, 136, 229, .12); }
    .yield-page .yield-search button {
      padding: 8px 20px; border-radius: 6px; font-size: 14px; font-weight: 500;
      cursor: pointer; border: 1px solid; transition: all .2s;
    }
    .yield-page .yield-search button[disabled] { opacity: .5; cursor: not-allowed; }
    .yield-page .yield-search button:first-of-type {
      background: linear-gradient(180deg, #2196f3, #1e88e5); color: #fff; border: none;
      box-shadow: 0 1px 2px rgba(16, 24, 40, .1);
    }
    .yield-page .yield-search button:first-of-type:hover:not([disabled]) {
      background: linear-gradient(180deg, #1e88e5, #1976d2); box-shadow: 0 2px 6px rgba(30, 136, 229, .35);
    }
    .yield-page .yield-search button:last-of-type {
      background: #fff; color: #344054; border-color: #d0d5dd;
    }
    .yield-page .yield-search button:last-of-type:hover { background: #f2f4f7; }

    .yield-page .yield-header {
      display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; margin-bottom: 20px;
    }
    .yield-page .yh-card {
      background: #fff; border: 1px solid #e4e9f2; border-radius: 10px;
      padding: 12px 14px; box-shadow: 0 1px 2px rgba(16, 24, 40, .04);
    }
    .yield-page .yh-label { font-size: 12px; color: #667085; margin-bottom: 6px; font-weight: 500; }
    .yield-page .yh-value { font-size: 14px; color: #1d2939; font-weight: 600; word-break: break-all; }
    .yield-page .yh-value.big { font-size: 22px; font-weight: 700; }

    .yield-page .yield-section { margin-bottom: 24px; }
    .yield-page .yield-section-title {
      font-size: 14px; font-weight: 700; color: #1d2939; margin-bottom: 12px;
      padding-left: 10px; border-left: 3px solid #1565c0;
    }
    .yield-page .yield-empty {
      text-align: center; padding: 40px; color: #667085; background: #fff;
      border: 1px dashed #d0d5dd; border-radius: 8px;
    }
    .yield-page .yield-intro {
      background: #fff; border: 1px solid #e4e9f2; border-radius: 10px;
      padding: 40px; text-align: center;
    }

    /* 检验项目表格 */
    .yield-page .yield-table {
      width: 100%; border-collapse: collapse; font-size: 13px; background: #fff;
      border-radius: 8px; overflow: hidden; border: 1px solid #e4e9f2;
    }
    .yield-page .yield-table th {
      background: #f7f9fc; color: #667085; font-size: 13px; font-weight: bold;
      padding: 11px 14px; text-align: left; border-bottom: 1px solid #eef1f5;
    }
    .yield-page .yield-table td {
      padding: 11px 14px; border-bottom: 1px solid #eef1f5; color: #344054;
    }
    .yield-page .yield-table tr:last-child td { border-bottom: none; }
    .yield-page .yield-table tr:hover td { background: #f7fafd; }

    /* 表格内条形良率 */
    .yield-page .yield-bar-cell { display: flex; align-items: center; gap: 8px; }
    .yield-page .yield-bar-track {
      flex: 1; height: 10px; background: #f2f4f7; border-radius: 5px; overflow: hidden;
    }
    .yield-page .yield-bar-fill { height: 100%; border-radius: 5px; transition: width .3s; }
    .yield-page .yield-bar-pct { font-size: 12px; font-weight: 700; min-width: 42px; text-align: right; }

    /* 良率分布图 */
    .yield-page .yield-chart {
      background: #fff; border: 1px solid #e4e9f2; border-radius: 10px;
      padding: 16px 18px;
    }
    .yield-page .yield-chart-bar {
      display: grid; grid-template-columns: 140px 1fr 70px 70px;
      gap: 12px; align-items: center; padding: 9px 0; border-bottom: 1px dashed #f0f3f8;
    }
    .yield-page .yield-chart-bar:last-child { border-bottom: none; }
    .yield-page .yield-chart-info { min-width: 0; }
    .yield-page .yield-chart-name {
      font-size: 13px; font-weight: 600; color: #1d2939;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .yield-page .yield-chart-sub { font-size: 11px; color: #98a2b3; font-family: monospace; }
    .yield-page .yield-chart-bar-body {
      height: 18px; background: #f2f4f7; border-radius: 9px; overflow: hidden;
    }
    .yield-page .yield-chart-bar-fill {
      height: 100%; border-radius: 9px; transition: width .4s ease;
    }
    .yield-page .yield-chart-pct { font-size: 14px; font-weight: 700; text-align: right; }
    .yield-page .yield-chart-count { font-size: 12px; color: #667085; text-align: right; }

    /* 物料搜索选择器 */
    .yield-page .yield-mat-select { position: relative; min-width: 300px; }
    .yield-page .yield-mat-input-row { position: relative; display: flex; align-items: center; }
    .yield-page .yield-mat-input {
      width: 100%; padding: 7px 28px 7px 12px; border: 1px solid #d0d5dd;
      border-radius: 6px; font-size: 14px; color: #344054; background: #fff; outline: none;
      transition: border-color .2s, box-shadow .2s;
    }
    .yield-page .yield-mat-input:focus { border-color: #1e88e5; box-shadow: 0 0 0 3px rgba(30, 136, 229, .12); }
    .yield-page .yield-mat-clear {
      position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
      width: 18px; height: 18px; border-radius: 50%; text-align: center; line-height: 16px;
      font-size: 13px; color: #98a2b3; cursor: pointer; user-select: none;
    }
    .yield-page .yield-mat-clear:hover { background: #f2f4f7; color: #344054; }
    .yield-page .yield-mat-dropdown {
      position: absolute; top: calc(100% + 4px); left: 0; right: 0;
      background: #fff; border: 1px solid #d0d5dd; border-radius: 8px;
      box-shadow: 0 6px 20px rgba(16,24,40,.08);
      max-height: 320px; overflow-y: auto; z-index: 999;
    }
    .yield-page .yield-mat-empty { padding: 20px; text-align: center; color: #98a2b3; font-size: 13px; }
    .yield-page .yield-mat-option {
      padding: 7px 10px; cursor: pointer; border-bottom: 1px solid #f2f4f7;
    }
    .yield-page .yield-mat-option:last-child { border-bottom: none; }
    .yield-page .yield-mat-option:hover,
    .yield-page .yield-mat-option.sel { background: #f0f7ff; }
    .yield-page .yield-mat-option.sel .yield-mat-opt-id { color: #1565c0; }
    .yield-page .yield-mat-opt-id { font-family: monospace; font-size: 12.5px; color: #1d2939; font-weight: 600; }
    .yield-page .yield-mat-opt-name { font-size: 12.5px; color: #667085; margin-top: 2px; }
    .yield-page .yield-mat-opt-spec { color: #98a2b3; }

    /* === 多主件 ECN 可搜索下拉 === */
    .bom-ecn .ecn-mat-select { position: relative; min-width: 260px; flex: 1; max-width: 400px; }
    .bom-ecn .ecn-mat-input-row { position: relative; display: flex; align-items: center; }
    .bom-ecn .ecn-mat-input {
      width: 100%; padding: 7px 28px 7px 12px; border: 1px solid #d0d5dd;
      border-radius: 6px; font-size: 14px; color: #344054; background: #fff; outline: none;
      transition: border-color .2s, box-shadow .2s;
    }
    .bom-ecn .ecn-mat-input:focus { border-color: #1e88e5; box-shadow: 0 0 0 3px rgba(30, 136, 229, .12); }
    .bom-ecn .ecn-mat-clear {
      position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
      width: 18px; height: 18px; border-radius: 50%; text-align: center; line-height: 16px;
      font-size: 13px; color: #98a2b3; cursor: pointer; user-select: none;
    }
    .bom-ecn .ecn-mat-clear:hover { background: #f2f4f7; color: #344054; }
    .bom-ecn .ecn-mat-dropdown {
      position: absolute; top: calc(100% + 4px); left: 0; right: 0;
      background: #fff; border: 1px solid #d0d5dd; border-radius: 8px;
      box-shadow: 0 6px 20px rgba(16,24,40,.08);
      max-height: 320px; overflow-y: auto; z-index: 999;
    }
    .bom-ecn .ecn-mat-empty { padding: 20px; text-align: center; color: #98a2b3; font-size: 13px; }
    .bom-ecn .ecn-mat-option { padding: 7px 10px; cursor: pointer; border-bottom: 1px solid #f2f4f7; }
    .bom-ecn .ecn-mat-option:last-child { border-bottom: none; }
    .bom-ecn .ecn-mat-option:hover,
    .bom-ecn .ecn-mat-option.sel { background: #f0f7ff; }
    .bom-ecn .ecn-mat-option.sel .ecn-mat-opt-id { color: #1565c0; }
    .bom-ecn .ecn-mat-opt-id { font-family: monospace; font-size: 12.5px; color: #1d2939; font-weight: 600; }
    .bom-ecn .ecn-mat-opt-name { font-size: 12.5px; color: #667085; margin-top: 2px; }
    .bom-ecn .ecn-mat-opt-spec { color: #98a2b3; }

    @media (max-width: 980px) {
      .yield-page .yield-header { grid-template-columns: repeat(3, 1fr); }
      .yield-page .yield-chart-bar { grid-template-columns: 100px 1fr 60px 60px; }
    }

    /* === 装配分析 === */
    /* 顶部信息卡片与搜索条复用良率分析的 .yield-search / .yield-header / .yh-card / .yield-section 等通用样式 */

    /* 变更矩阵表格 */
    .ana-table { width: 100%; border-collapse: collapse; font-size: 12.5px; background: #fff; }
    .ana-table th, .ana-table td {
      border: 1px solid #eef1f5;
      padding: 8px 10px; text-align: center; white-space: nowrap;
    }
    .ana-table thead th {
      background: #f7f9fc; font-weight: bold; color: #667085; font-size: 13px;
      vertical-align: top; border-bottom: 1px solid #eef1f5;
    }
    /* 三个冻结列：固定宽度，th/td 同样定位，避免重叠 */
    .ana-table th.pin, .ana-table td.pin {
      position: sticky; z-index: 3; text-align: center; vertical-align: middle;
      background: #fff; overflow: hidden; text-overflow: ellipsis;
    }
    .ana-table th.pin {
      z-index: 5; background: #f7f9fc !important; color: #667085;
    }
    .ana-table th.pin:nth-child(1), .ana-table td.pin:nth-child(1) { left: 0;   width: 150px; min-width: 150px; max-width: 150px; }
    .ana-table th.pin:nth-child(2), .ana-table td.pin:nth-child(2) { left: 150px; width: 140px; min-width: 140px; max-width: 140px; }
    .ana-table th.pin:nth-child(3), .ana-table td.pin:nth-child(3) {
      left: 290px; width: 150px; min-width: 150px; max-width: 150px;
      box-shadow: 6px 0 6px -6px rgba(0,0,0,0.15);
    }
    /* 版本列表头 */
    .ana-th-ver { min-width: 132px; position: relative; }
    .ana-th-current { background: #eaf2fb !important; color: #1565c0; }
    .ana-th-current::after {
      content: "●"; position: absolute; top: 6px; right: 8px;
      font-size: 8px; color: #1565c0;
    }
    /* hover */
    .ana-table tbody tr:hover td { background: #f7fafd; }
    .ana-table tbody tr:hover td.pin { background: #f7fafd !important; }
    /* 单元格 */
    .ana-cell {
      position: relative; min-width: 140px; max-width: 220px;
      font-size: 12px; line-height: 1.35;
    }
    .ana-cell-sn {
      white-space: nowrap; font-size: 11px; margin: 0 auto; font-weight: 500;
    }
    .ana-cell-empty, .ana-cell-none {
      font-size: 11px; opacity: .55; line-height: 1.5;
    }
    .ana-none { color: #c0c4cc !important; background: #e8e8e8 !important; }
  </style>
</head>
<body>
  <div id="app" class="app">
    <!-- 登录页：未登录时仅显示登录界面 -->
    <div class="login-page" v-if="!loggedIn">
      <div class="login-box">
        <div class="login-title">QMES 质量管理系统</div>
        <div class="login-sub">请登录后使用系统功能</div>
        <div class="login-field">
          <label>用户名</label>
          <input v-model.trim="loginForm.username" @keyup.enter="doLogin" placeholder="请输入用户名" autocomplete="username">
        </div>
        <div class="login-field">
          <label>密码</label>
          <input type="password" v-model="loginForm.password" @keyup.enter="doLogin" placeholder="请输入密码" autocomplete="current-password">
        </div>
        <div class="login-error" v-if="loginError">{{ loginError }}</div>
        <button class="login-btn" :disabled="loginLoading" @click="doLogin">{{ loginLoading ? '登录中...' : '登 录' }}</button>
      </div>
    </div>
    <template v-else>
    <!-- 顶部导航 -->
    <div class="topbar">
      <div class="logo">QMES 质量管理系统</div>
      <div class="user">
        <span :class="['ws-status', wsConnected ? 'on' : 'off']"></span>
        {{ wsConnected ? '服务已连接' : '服务未连接' }} &nbsp;|&nbsp; {{ currentUser.realname || currentUser.username }}
        <span class="logout-link" @click="doLogout">退出</span>
      </div>
    </div>

    <!-- 主体 -->
    <div class="body">
      <!-- 侧边导航 -->
      <div class="sidebar">
        <div v-for="group in menu" :key="group.title">
          <div class="group-title">{{ group.title }}</div>
          <div
            v-for="item in group.items"
            :key="item.key"
            :class="['menu-item', { active: activeTabObj && activeTabObj.origin === item.key }]"
            @click="openMenu(item)"
          >{{ item.label }}</div>
        </div>
      </div>

      <!-- 主区域：页签栏 + 页面 -->
      <div class="main">
        <div class="tabbar" v-if="tabs.length">
          <div
            v-for="t in tabs"
            :key="t.key"
            :class="['tab', { active: activeTab === t.key }]"
            @click="activeTab = t.key"
          >
            <span>{{ t.label }}</span>
            <span class="tab-close" @click.stop="closeTab(t.key)">×</span>
          </div>
        </div>

        <component v-if="activeTabObj" :is="activeTabObj.page" :key="activeTab" :ws="ws" :nav="go" :params="activeTabObj.params" :origin="activeTabObj.origin"></component>
        <!-- 无打开页签时默认显示业务链路总览 -->
        <page-guide v-else key="guide"></page-guide>
      </div>
    </div>
    </template>
  </div>

  <script src="js/components.js?v=20261024r"></script>
  <script src="js/app.js?v=20261024r"></script>
</body>
</html>
